<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <title>Corkboard App</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Corkboard">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/889/889647.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      background-color: #1a1715;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      position: fixed;
    }

    #app-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: max(env(safe-area-inset-top), 8px);
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
      padding-left: max(env(safe-area-inset-left), 8px);
      padding-right: max(env(safe-area-inset-right), 8px);
      position: relative;
    }

    /* タブヘッダー */
    #tab-header-wrapper {
      display: flex;
      align-items: flex-end;
      width: 100%;
      height: 38px;
      z-index: 100;
      flex-shrink: 0;
      gap: 6px;
    }

    #btn-add-tab {
      background: #423528;
      color: #dfcaa7;
      border: 1px dashed #755239;
      border-bottom: none;
      padding: 7px 12px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
    }
    #btn-add-tab:active { background: #5a4533; }

    #tab-bar {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      flex-grow: 1;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      height: 100%;
    }
    #tab-bar::-webkit-scrollbar { display: none; }
    #tab-bar.reordering { overflow-x: hidden !important; }

    .board-tab {
      background: #382e25;
      color: #b39b87;
      padding: 7px 14px;
      border-radius: 6px 6px 0 0;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #4d3321;
      border-bottom: none;
      flex-shrink: 0;
      touch-action: pan-x;
      transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
      position: relative;
      height: 34px;
    }
    .board-tab.active {
      background: #4d3321;
      color: #fff;
      font-weight: bold;
      height: 37px;
    }
    .board-tab.tab-dragging {
      opacity: 0.92;
      transform: scale(1.08) translateY(-3px);
      background: #7a4f30 !important;
      box-shadow: 0 8px 16px rgba(0,0,0,0.65);
      z-index: 200;
    }

    .tab-close {
      font-size: 14px;
      opacity: 0.6;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
    }

    /* コルクフレーム */
    #board-frame {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border-radius: 0 6px 8px 8px;
      border: 8px solid #4d3321;
      box-shadow: 
        inset 0 0 10px rgba(0,0,0,0.8),
        inset 0 0 20px rgba(0,0,0,0.6),
        0 8px 20px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
    }

    #board-surface {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #c99355;
      background-image: 
        radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 100%),
        radial-gradient(#8f5e2e 12%, transparent 13%),
        radial-gradient(#deb37a 10%, transparent 12%),
        radial-gradient(#704620 15%, transparent 16%);
      background-size: 100% 100%, 16px 16px, 22px 22px, 30px 30px;
      background-position: 0 0, 0 0, 8px 8px, 15px 15px;
      box-shadow: inset 4px 4px 16px rgba(0,0,0,0.55);
      cursor: default;
      touch-action: pan-y;
    }

    /* ツールバー */
    #toolbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      background: rgba(26, 23, 21, 0.95);
      padding: 7px 16px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 40000;
      white-space: nowrap;
    }

    .tool-btn {
      background: #423832;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tool-btn:active { background: #5c4e45; }

    .sticky-color-group {
      display: flex;
      gap: 8px;
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .sticky-label { color: #ccc; font-size: 11px; white-space: nowrap; }
    .sticky-btn {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      flex-shrink: 0;
    }
    .sticky-btn:active { transform: scale(0.88); }
    .sticky-btn-yellow { background-color: #fff59d; }
    .sticky-btn-pink   { background-color: #ffcdd2; }
    .sticky-btn-blue   { background-color: #b3e5fc; }
    .sticky-btn-green  { background-color: #c8e6c9; }

    /* 写真カード */
    .photo-card {
      position: absolute;
      width: 130px;
      padding: 6px 6px 8px 6px;
      background: #fdfdfd;
      border-radius: 2px;
      box-shadow: 2px 5px 14px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    .photo-card:hover, .sticky-note:hover {
      box-shadow: 3px 7px 18px rgba(0, 0, 0, 0.45);
      z-index: 9000 !important;
    }

    .photo-card.dragging, .sticky-note.dragging {
      box-shadow: 10px 20px 30px rgba(0, 0, 0, 0.45);
    }

    .photo-img-wrapper {
      width: 100%;
      overflow: hidden;
      border-radius: 1px;
      cursor: pointer;
    }
    .photo-card img {
      width: 100%;
      height: auto;
      max-height: 240px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .caption-textarea {
      width: 100%;
      margin-top: 5px;
      border: none;
      background: transparent;
      outline: none;
      resize: none;
      font-family: 'Yomogi', cursive, sans-serif;
      font-size: 13px;
      line-height: 1.3;
      color: #2b2b2b;
      text-align: center;
      cursor: text;
      padding: 2px;
      min-height: 24px;
      overflow: hidden;
    }
    .caption-textarea:focus { background: rgba(0, 0, 0, 0.04); border-radius: 2px; }
    .caption-textarea::placeholder { color: #b0b0b0; font-size: 11px; }

    /* 付箋 */
    .sticky-note {
      position: absolute;
      width: 120px;
      min-height: 110px;
      padding: 16px 8px 8px 8px;
      border-radius: 2px;
      box-shadow: 2px 6px 14px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    .note-yellow { background-color: #fff9c4; border-bottom: 2px solid #fff59d; }
    .note-pink   { background-color: #ffebee; border-bottom: 2px solid #ffcdd2; }
    .note-blue   { background-color: #e1f5fe; border-bottom: 2px solid #b3e5fc; }
    .note-green  { background-color: #e8f5e9; border-bottom: 2px solid #c8e6c9; }

    .sticky-textarea {
      width: 100%;
      flex-grow: 1;
      border: none;
      background: transparent;
      outline: none;
      resize: none;
      font-family: 'Yomogi', cursive, sans-serif;
      font-size: 13px;
      line-height: 1.3;
      color: #333;
      cursor: text;
    }
    .sticky-textarea::placeholder { color: rgba(0, 0, 0, 0.35); font-size: 11px; }

    /* コントロールボタン群 */
    .card-ctrl {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.2s;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      z-index: 30;
      touch-action: none;
    }

    .photo-card:hover .card-ctrl,
    .sticky-note:hover .card-ctrl { opacity: 1; }

    .ctrl-delete { top: -8px; right: -8px; background-color: #ef5350; }
    .ctrl-delete::before { content: '×'; }

    .ctrl-copy { top: -8px; left: -8px; background-color: #ff9800; font-size: 12px; }
    .ctrl-copy::before { content: '📋'; }

    .ctrl-rotate { bottom: -8px; right: -8px; background-color: #42a5f5; cursor: grab; }
    .ctrl-rotate::before { content: '↻'; }

    .ctrl-resize { bottom: -8px; left: -8px; background-color: #66bb6a; font-size: 11px; cursor: grab; }
    .ctrl-resize::before { content: '⤢'; }

    @keyframes pin-out {
      0% { transform: translate(0, 0) rotate(var(--r)); opacity: 1; }
      100% { transform: translate(0, 20px) rotate(var(--r)); opacity: 0; }
    }
    .removing { pointer-events: none; animation: pin-out 0.22s ease-in forwards; }

    .pin {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      z-index: 10;
      pointer-events: none;
      transition: transform 0.2s ease-out, opacity 0.2s;
    }
    .pin-round { width: 12px; height: 12px; box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.6); }
    .pin-red { background: radial-gradient(circle at 35% 35%, #ff5252, #a81212); }
    .pin-cyan { background: radial-gradient(circle at 35% 35%, #00e5ff, #00838f); }
    .pin-yellow { background: radial-gradient(circle at 35% 35%, #ffeb3b, #f57f17); }
    .pin-green { background: radial-gradient(circle at 35% 35%, #69f0ae, #1b5e20); }
    .pin-metal { width: 13px; height: 13px; box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.7); }
    .pin-silver { background: radial-gradient(circle at 40% 40%, #ffffff 0%, #b0bec5 50%, #455a64 100%); }
    .pin-gold { background: radial-gradient(circle at 40% 40%, #fff9c4 0%, #d4af37 55%, #6b4d1b 100%); }

    /* 2本指ズーム画像ビューアー */
    #viewer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 8, 7, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 80000;
      touch-action: none;
      overflow: hidden;
    }
    #viewer-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      will-change: transform;
    }
    #viewer-img {
      max-width: 86vw;
      max-height: 72vh;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      border-radius: 4px;
      border: 4px solid #fff;
      pointer-events: none;
    }
    #viewer-close-btn {
      position: absolute;
      top: max(env(safe-area-inset-top), 16px);
      right: 18px;
      background: rgba(40, 35, 32, 0.85);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 90000;
    }

    /* コピー先モーダル & パスコードモーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100000;
    }
    .modal-card {
      background: #2b2520;
      border: 1px solid #5a3d28;
      border-radius: 12px;
      padding: 20px 24px;
      width: 280px;
      text-align: center;
      color: #f0f0f0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-card h3 { font-size: 16px; margin-bottom: 8px; }
    .modal-card p { font-size: 13px; color: #bbb; margin-bottom: 14px; line-height: 1.4; }
    .modal-btn {
      background: #e65100;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    .modal-btn-close {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
      padding: 6px;
    }
    .pin-input {
      letter-spacing: 14px;
      font-size: 22px;
      width: 140px;
      text-align: center;
      background: #1a1715;
      border: 1px solid #5a3d28;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 14px;
      outline: none;
    }
    .copy-target-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .copy-target-item {
      background: #3c3229;
      color: #eee;
      border: 1px solid #5a3d28;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    .copy-target-item:active { background: #5a4533; }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="tab-header-wrapper">
      <button id="btn-add-tab" title="新しいシートを追加">＋</button>
      <div id="tab-bar"></div>
    </div>

    <div id="board-frame">
      <div id="board-surface"></div>
      <div id="toolbar">
        <button class="tool-btn" id="btn-add-photo">📷 写真追加</button>
        <div class="sticky-color-group">
          <span class="sticky-label">付箋:</span>
          <button class="sticky-btn sticky-btn-yellow" data-color="note-yellow"></button>
          <button class="sticky-btn sticky-btn-pink" data-color="note-pink"></button>
          <button class="sticky-btn sticky-btn-blue" data-color="note-blue"></button>
          <button class="sticky-btn sticky-btn-green" data-color="note-green"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 拡大ビューアー -->
  <div id="viewer-modal">
    <div id="viewer-close-btn">×</div>
    <div id="viewer-container">
      <img id="viewer-img" src="" alt="拡大画像">
    </div>
  </div>

  <!-- コピー先シート選択モーダル -->
  <div class="modal-overlay" id="copy-modal">
    <div class="modal-card">
      <h3>📋 コピー先シートを選択</h3>
      <p>コピー先のシートをタップしてください。</p>
      <div class="copy-target-list" id="copy-target-list"></div>
      <button class="modal-btn-close" id="btn-cancel-copy">キャンセル</button>
    </div>
  </div>

  <!-- 暗証番号モーダル -->
  <div class="modal-overlay" id="passcode-modal">
    <div class="modal-card">
      <h3>🔒 シークレットロック</h3>
      <p>このボードを開くには4桁の暗証番号を入力してください。<br><small>(初期値: 1234)</small></p>
      <input type="password" id="passcode-input" class="pin-input" maxlength="4" inputmode="numeric">
      <button class="modal-btn" id="btn-unlock">解除</button>
      <button class="modal-btn-close" id="btn-cancel-unlock">キャンセル</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display: none;">

  <script>
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPinSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(120, t + 0.04);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.04);

        const thud = ctx.createOscillator();
        const thudGain = ctx.createGain();
        thud.type = 'sine';
        thud.frequency.setValueAtTime(220, t);
        thud.frequency.exponentialRampToValueAtTime(40, t + 0.06);
        thudGain.gain.setValueAtTime(0.4, t);
        thudGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        thud.connect(thudGain);
        thudGain.connect(ctx.destination);
        thud.start(t);
        thud.stop(t + 0.06);
      } catch (e) { }
    }

    function playUnpinSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(950, t + 0.06);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      } catch (e) { }
    }

    function bindInstantAction(el, fn) {
      let isMoved = false;
      let startX = 0, startY = 0;
      el.addEventListener('pointerdown', (e) => {
        isMoved = false;
        startX = e.clientX;
        startY = e.clientY;
      });
      el.addEventListener('pointermove', (e) => {
        if (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6) {
          isMoved = true;
        }
      });
      el.addEventListener('pointerup', (e) => {
        if (!isMoved) {
          e.preventDefault();
          fn(e);
        }
      });
    }

    // --- ストレージ二重永続化 ---
    const DB_NAME = 'CorkboardAppDB_v2';
    const STORE_NAME = 'boards';
    let db;

    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve();
        };
        req.onerror = () => resolve();
      });
    }

    function saveCurrentBoardData() {
      if (!currentBoardId) return;
      const items = [];
      document.querySelectorAll('.photo-card, .sticky-note').forEach(el => {
        const item = {
          id: el.dataset.id,
          type: el.classList.contains('photo-card') ? 'photo' : 'note',
          left: el.offsetLeft,
          top: el.offsetTop,
          width: el.offsetWidth,
          height: el.offsetHeight,
          rotation: el.dataset.rotation,
          pinClass: el.dataset.pinClass,
          zIndex: parseInt(el.style.zIndex) || 100
        };
        if (item.type === 'photo') {
          item.imgSrc = el.querySelector('img').src;
          item.caption = el.querySelector('.caption-textarea').value;
        } else {
          item.noteColor = el.dataset.noteColor;
          item.text = el.querySelector('.sticky-textarea').value;
        }
        items.push(item);
      });

      const boardObj = {
        id: currentBoardId,
        title: boards.find(b => b.id === currentBoardId)?.title || '無題',
        items: items
      };

      if (db) {
        try {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(boardObj);
        } catch (e) { }
      }

      try {
        localStorage.setItem(`cb_backup_${currentBoardId}`, JSON.stringify(boardObj));
      } catch (e) { }
    }

    function loadBoardData(boardId) {
      return new Promise((resolve) => {
        if (!db) {
          const local = localStorage.getItem(`cb_backup_${boardId}`);
          resolve(local ? JSON.parse(local).items : []);
          return;
        }
        try {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(boardId);
          req.onsuccess = () => {
            if (req.result && req.result.items) {
              resolve(req.result.items);
            } else {
              const local = localStorage.getItem(`cb_backup_${boardId}`);
              resolve(local ? JSON.parse(local).items : []);
            }
          };
          req.onerror = () => {
            const local = localStorage.getItem(`cb_backup_${boardId}`);
            resolve(local ? JSON.parse(local).items : []);
          };
        } catch (e) {
          const local = localStorage.getItem(`cb_backup_${boardId}`);
          resolve(local ? JSON.parse(local).items : []);
        }
      });
    }

    let boards = JSON.parse(localStorage.getItem('corkboard_tabs')) || [
      { id: 'daily', title: '📅 デイリー予定' },
      { id: 'favorite', title: '✨ お気に入り' },
      { id: 'secret', title: '🔒 プライベート', isLocked: true }
    ];
    let currentBoardId = localStorage.getItem('corkboard_active_tab') || 'daily';
    let highestZIndex = 100;
    const surface = document.getElementById('board-surface');
    const tabBar = document.getElementById('tab-bar');
    let pendingBoardId = null;
    let copyingItemData = null;

    function renderTabs() {
      tabBar.innerHTML = '';
      boards.forEach((b, index) => {
        const tab = document.createElement('div');
        tab.className = `board-tab ${b.id === currentBoardId ? 'active' : ''}`;
        tab.dataset.id = b.id;
        tab.dataset.index = index;
        tab.innerHTML = `
          <span class="tab-title">${b.title}</span>
          ${boards.length > 1 ? `<span class="tab-close" title="削除">×</span>` : ''}
        `;

        setupTabInteraction(tab, b);
        tabBar.appendChild(tab);
      });

      const activeTab = tabBar.querySelector('.board-tab.active');
      if (activeTab) {
        activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function setupTabInteraction(tab, board) {
      let holdTimer = null;
      let isDraggingMode = false;
      let startX = 0, startY = 0;
      let lastTapTime = 0;
      let lastHoverIndex = -1;

      tab.addEventListener('dblclick', (e) => {
        if (!e.target.classList.contains('tab-close')) {
          renameBoard(board.id);
        }
      });

      tab.addEventListener('touchstart', (e) => {
        if (e.target.classList.contains('tab-close')) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isDraggingMode = false;

        const now = Date.now();
        if (now - lastTapTime < 300) {
          clearTimeout(holdTimer);
          renameBoard(board.id);
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;

        holdTimer = setTimeout(() => {
          isDraggingMode = true;
          tabBar.classList.add('reordering');
          tab.classList.add('tab-dragging');
          playPinSound();
        }, 400);
      }, { passive: false });

      tab.addEventListener('touchmove', (e) => {
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const diffX = currentX - startX;
        const diffY = currentY - startY;

        if (!isDraggingMode) {
          if (Math.abs(diffX) > 8 || Math.abs(diffY) > 8) {
            clearTimeout(holdTimer);
          }
          return;
        }

        e.preventDefault();
        tab.style.transform = `translateX(${diffX}px) scale(1.08) translateY(-3px)`;

        const elem = document.elementFromPoint(currentX, currentY);
        const targetTab = elem ? elem.closest('.board-tab') : null;

        if (targetTab && targetTab !== tab) {
          const toIndex = parseInt(targetTab.dataset.index);
          const fromIndex = parseInt(tab.dataset.index);
          if (!isNaN(toIndex) && !isNaN(fromIndex) && toIndex !== lastHoverIndex) {
            lastHoverIndex = toIndex;
            const moved = boards.splice(fromIndex, 1)[0];
            boards.splice(toIndex, 0, moved);
            localStorage.setItem('corkboard_tabs', JSON.stringify(boards));
            renderTabs();
          }
        }
      }, { passive: false });

      tab.addEventListener('touchend', (e) => {
        clearTimeout(holdTimer);
        tabBar.classList.remove('reordering');

        if (isDraggingMode) {
          playPinSound();
          tab.classList.remove('tab-dragging');
          tab.style.transform = '';
          isDraggingMode = false;
          renderTabs();
        } else {
          if (!e.target.classList.contains('tab-close')) {
            handleTabSwitch(board);
          }
        }
      });

      tab.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-close')) {
          e.stopPropagation();
          if (confirm(`「${board.title}」を削除しますか？`)) deleteBoard(board.id);
        }
      });
    }

    function handleTabSwitch(board) {
      if (currentBoardId !== board.id) {
        if (board.isLocked) {
          pendingBoardId = board.id;
          openPasscodeModal();
        } else {
          saveCurrentBoardData();
          switchBoard(board.id);
        }
      }
    }

    function setupSwipeNavigation() {
      let swipeStartX = 0;
      let swipeStartY = 0;
      let isSwiping = false;

      surface.addEventListener('touchstart', (e) => {
        if (e.target === surface) {
          swipeStartX = e.touches[0].clientX;
          swipeStartY = e.touches[0].clientY;
          isSwiping = true;
        } else {
          isSwiping = false;
        }
      }, { passive: true });

      surface.addEventListener('touchend', (e) => {
        if (!isSwiping) return;
        const diffX = e.changedTouches[0].clientX - swipeStartX;
        const diffY = e.changedTouches[0].clientY - swipeStartY;

        if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          const currentIndex = boards.findIndex(b => b.id === currentBoardId);
          if (diffX < 0 && currentIndex < boards.length - 1) {
            handleTabSwitch(boards[currentIndex + 1]);
          } else if (diffX > 0 && currentIndex > 0) {
            handleTabSwitch(boards[currentIndex - 1]);
          }
        }
        isSwiping = false;
      }, { passive: true });
    }

    function renameBoard(id) {
      const b = boards.find(item => item.id === id);
      if (!b) return;
      const newTitle = prompt('シートの新しい名称を入力してください:', b.title);
      if (newTitle && newTitle.trim()) {
        b.title = newTitle.trim();
        localStorage.setItem('corkboard_tabs', JSON.stringify(boards));
        saveCurrentBoardData();
        renderTabs();
      }
    }

    function openPasscodeModal() {
      const modal = document.getElementById('passcode-modal');
      const input = document.getElementById('passcode-input');
      input.value = '';
      modal.style.display = 'flex';
      setTimeout(() => input.focus(), 150);
    }

    bindInstantAction(document.getElementById('btn-unlock'), () => {
      const pin = document.getElementById('passcode-input').value;
      if (pin === '1234') {
        document.getElementById('passcode-modal').style.display = 'none';
        saveCurrentBoardData();
        switchBoard(pendingBoardId);
        pendingBoardId = null;
      } else {
        alert('暗証番号が違います');
        document.getElementById('passcode-input').value = '';
      }
    });

    bindInstantAction(document.getElementById('btn-cancel-unlock'), () => {
      document.getElementById('passcode-modal').style.display = 'none';
      pendingBoardId = null;
    });

    function switchBoard(id) {
      currentBoardId = id;
      localStorage.setItem('corkboard_active_tab', id);
      renderTabs();
      surface.innerHTML = '';
      loadBoardData(id).then(items => items.forEach(renderItemFromData));
    }

    function deleteBoard(id) {
      boards = boards.filter(b => b.id !== id);
      localStorage.setItem('corkboard_tabs', JSON.stringify(boards));
      if (db) {
        try {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).delete(id);
        } catch (e) { }
      }
      localStorage.removeItem(`cb_backup_${id}`);
      switchBoard(boards[0].id);
    }

    bindInstantAction(document.getElementById('btn-add-tab'), () => {
      const name = prompt('新しいシート名を入力してください:', '新しいボード');
      if (name && name.trim()) {
        const newId = 'board_' + Date.now();
        boards.push({ id: newId, title: name.trim() });
        localStorage.setItem('corkboard_tabs', JSON.stringify(boards));
        saveCurrentBoardData();
        switchBoard(newId);
      }
    });

    // --- コピーモーダル ---
    const copyModal = document.getElementById('copy-modal');
    const copyTargetList = document.getElementById('copy-target-list');

    function openCopyModal(itemData) {
      copyingItemData = itemData;
      copyTargetList.innerHTML = '';
      boards.forEach(b => {
        if (b.id !== currentBoardId) {
          const btn = document.createElement('div');
          btn.className = 'copy-target-item';
          btn.textContent = b.title;
          btn.addEventListener('click', () => {
            copyItemToBoard(b.id, copyingItemData);
            copyModal.style.display = 'none';
            playPinSound();
            alert(`「${b.title}」へコピーしました`);
          });
          copyTargetList.appendChild(btn);
        }
      });
      if (copyTargetList.children.length === 0) {
        copyTargetList.innerHTML = '<div style="font-size:12px;color:#aaa;padding:8px;">コピー可能な他のシートがありません</div>';
      }
      copyModal.style.display = 'flex';
    }

    bindInstantAction(document.getElementById('btn-cancel-copy'), () => {
      copyModal.style.display = 'none';
      copyingItemData = null;
    });

    function copyItemToBoard(targetBoardId, item) {
      loadBoardData(targetBoardId).then(existingItems => {
        const newItem = JSON.parse(JSON.stringify(item));
        newItem.id = (newItem.type === 'photo' ? 'p_' : 'n_') + Date.now() + Math.random();
        newItem.left = Math.max(10, newItem.left + 15);
        newItem.top = Math.max(10, newItem.top + 15);
        existingItems.push(newItem);

        const boardObj = {
          id: targetBoardId,
          title: boards.find(b => b.id === targetBoardId)?.title || '無題',
          items: existingItems
        };

        if (db) {
          try {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(boardObj);
          } catch (e) { }
        }
        try {
          localStorage.setItem(`cb_backup_${targetBoardId}`, JSON.stringify(boardObj));
        } catch (e) { }
      });
    }

    const pinStyles = [
      'pin-round pin-red', 'pin-round pin-cyan', 'pin-round pin-yellow', 'pin-round pin-green',
      'pin-metal pin-silver', 'pin-metal pin-gold'
    ];
    function getRandomPin() { return pinStyles[Math.floor(Math.random() * pinStyles.length)]; }
    function getRandomRotation() { return (Math.random() * 12 - 6).toFixed(1); }

    function updateTransform(el, scale = 1) {
      const rot = el.dataset.rotation;
      el.style.transform = `rotate(${rot}deg) scale(${scale})`;
      el.style.setProperty('--r', `${rot}deg`);
    }

    function autoResizeTextarea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function createPhotoElement(data) {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.dataset.id = data.id || ('p_' + Date.now() + Math.random());
      card.dataset.rotation = data.rotation;
      card.dataset.pinClass = data.pinClass;
      card.dataset.originalWidth = data.width || 130;
      card.style.left = `${data.left}px`;
      card.style.top = `${data.top}px`;
      card.style.width = `${data.width || 130}px`;
      card.style.zIndex = data.zIndex || ++highestZIndex;
      updateTransform(card);

      card.innerHTML = `
        <div class="pin ${data.pinClass}"></div>
        <div class="card-ctrl ctrl-delete" title="削除"></div>
        <div class="card-ctrl ctrl-copy" title="別シートにコピー"></div>
        <div class="card-ctrl ctrl-rotate" title="回転"></div>
        <div class="card-ctrl ctrl-resize" title="大きさ変更"></div>
        <div class="photo-img-wrapper">
          <img src="${data.imgSrc}" alt="photo">
        </div>
        <textarea class="caption-textarea" placeholder="コメント..." rows="1">${data.caption || ''}</textarea>
      `;

      surface.appendChild(card);
      setupCardInteraction(card);

      const textarea = card.querySelector('.caption-textarea');
      autoResizeTextarea(textarea);
      textarea.addEventListener('input', () => autoResizeTextarea(textarea));

      bindInstantAction(card.querySelector('.ctrl-copy'), (e) => {
        e.stopPropagation();
        openCopyModal({
          type: 'photo',
          imgSrc: card.querySelector('img').src,
          caption: card.querySelector('.caption-textarea').value,
          left: card.offsetLeft,
          top: card.offsetTop,
          width: card.offsetWidth,
          height: card.offsetHeight,
          rotation: card.dataset.rotation,
          pinClass: card.dataset.pinClass,
          zIndex: parseInt(card.style.zIndex) || 100
        });
      });

      return card;
    }

    // --- 拡大ビューアー ---
    const viewerModal = document.getElementById('viewer-modal');
    const viewerContainer = document.getElementById('viewer-container');
    const viewerImg = document.getElementById('viewer-img');
    const viewerCloseBtn = document.getElementById('viewer-close-btn');

    let vScale = 1;
    let vPosX = 0;
    let vPosY = 0;
    let vStartDistance = 0;
    let vStartScale = 1;
    let vStartX = 0, vStartY = 0;
    let vStartPosX = 0, vStartPosY = 0;
    let isPinching = false;
    let isPanning = false;

    function openViewer(imgSrc) {
      playUnpinSound();
      viewerImg.src = imgSrc;
      vScale = 1;
      vPosX = 0;
      vPosY = 0;
      viewerContainer.style.transition = 'none';
      applyViewerTransform();
      viewerModal.style.display = 'flex';
    }

    function closeViewer() {
      playPinSound();
      viewerModal.style.display = 'none';
      viewerImg.src = '';
    }

    function clampPosition() {
      if (vScale <= 1) {
        vPosX = 0;
        vPosY = 0;
        return;
      }
      const rect = viewerImg.getBoundingClientRect();
      const currentW = (rect.width / (vScale || 1)) * vScale;
      const currentH = (rect.height / (vScale || 1)) * vScale;

      const maxMoveX = Math.max(0, (currentW - window.innerWidth * 0.9) / 2);
      const maxMoveY = Math.max(0, (currentH - window.innerHeight * 0.8) / 2);

      vPosX = Math.min(maxMoveX, Math.max(-maxMoveX, vPosX));
      vPosY = Math.min(maxMoveY, Math.max(-maxMoveY, vPosY));
    }

    function applyViewerTransform() {
      viewerContainer.style.transform = `translate(${vPosX}px, ${vPosY}px) scale(${vScale})`;
    }

    bindInstantAction(viewerCloseBtn, closeViewer);

    viewerModal.addEventListener('touchstart', (e) => {
      viewerContainer.style.transition = 'none';
      if (e.touches.length === 2) {
        isPinching = true;
        isPanning = false;
        vStartDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        vStartScale = vScale;
      } else if (e.touches.length === 1) {
        if (vScale > 1) {
          isPanning = true;
          vStartX = e.touches[0].clientX;
          vStartY = e.touches[0].clientY;
          vStartPosX = vPosX;
          vStartPosY = vPosY;
        }
      }
    }, { passive: false });

    viewerModal.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (isPinching && e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (vStartDistance > 0) {
          const factor = dist / vStartDistance;
          vScale = Math.min(4.5, Math.max(0.8, vStartScale * factor));
          clampPosition();
          applyViewerTransform();
        }
      } else if (isPanning && e.touches.length === 1 && vScale > 1) {
        const dx = e.touches[0].clientX - vStartX;
        const dy = e.touches[0].clientY - vStartY;
        vPosX = vStartPosX + dx;
        vPosY = vStartPosY + dy;
        clampPosition();
        applyViewerTransform();
      }
    }, { passive: false });

    viewerModal.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isPinching = false;
        isPanning = false;
        if (vScale <= 1) {
          vScale = 1;
          vPosX = 0;
          vPosY = 0;
        } else {
          clampPosition();
        }
        viewerContainer.style.transition = 'transform 0.22s ease-out';
        applyViewerTransform();
      } else if (e.touches.length === 1) {
        isPinching = false;
        if (vScale > 1) {
          isPanning = true;
          vStartX = e.touches[0].clientX;
          vStartY = e.touches[0].clientY;
          vStartPosX = vPosX;
          vStartPosY = vPosY;
        }
      }
    });

    viewerModal.addEventListener('click', (e) => {
      if (e.target === viewerModal) closeViewer();
    });

    function createNoteElement(data) {
      const note = document.createElement('div');
      note.className = `sticky-note ${data.noteColor}`;
      note.dataset.id = data.id || ('n_' + Date.now() + Math.random());
      note.dataset.rotation = data.rotation;
      note.dataset.noteColor = data.noteColor;
      note.dataset.pinClass = data.pinClass;
      note.style.left = `${data.left}px`;
      note.style.top = `${data.top}px`;
      if (data.width) note.style.width = `${data.width}px`;
      if (data.height) note.style.height = `${data.height}px`;
      note.style.zIndex = data.zIndex || ++highestZIndex;
      updateTransform(note);

      note.innerHTML = `
        <div class="pin ${data.pinClass}"></div>
        <div class="card-ctrl ctrl-delete" title="削除"></div>
        <div class="card-ctrl ctrl-copy" title="別シートにコピー"></div>
        <div class="card-ctrl ctrl-rotate" title="回転"></div>
        <div class="card-ctrl ctrl-resize" title="大きさ変更"></div>
        <textarea class="sticky-textarea" placeholder="メモ...">${data.text || ''}</textarea>
      `;

      surface.appendChild(note);
      setupCardInteraction(note);

      bindInstantAction(note.querySelector('.ctrl-copy'), (e) => {
        e.stopPropagation();
        openCopyModal({
          type: 'note',
          noteColor: note.dataset.noteColor,
          text: note.querySelector('.sticky-textarea').value,
          left: note.offsetLeft,
          top: note.offsetTop,
          width: note.offsetWidth,
          height: note.offsetHeight,
          rotation: note.dataset.rotation,
          pinClass: note.dataset.pinClass,
          zIndex: parseInt(note.style.zIndex) || 100
        });
      });

      return note;
    }

    function renderItemFromData(item) {
      if (item.type === 'photo') createPhotoElement(item);
      else createNoteElement(item);
    }

    const fileInput = document.getElementById('fileInput');
    const btnAddPhoto = document.getElementById('btn-add-photo');
    
    bindInstantAction(btnAddPhoto, () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const rect = surface.getBoundingClientRect();
        addPhoto(file, rect.width / 2 - 65, rect.height / 2 - 75);
      }
      fileInput.value = '';
    });

    surface.addEventListener('dragover', (e) => e.preventDefault());
    surface.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      const rect = surface.getBoundingClientRect();
      files.forEach((file, index) => {
        addPhoto(file, e.clientX - rect.left - 65 + (index * 16), e.clientY - rect.top - 75 + (index * 16));
      });
    });

    function addPhoto(file, x, y) {
      const reader = new FileReader();
      reader.onload = (event) => {
        playPinSound();
        createPhotoElement({
          left: Math.max(10, x),
          top: Math.max(10, y),
          width: 130,
          rotation: getRandomRotation(),
          pinClass: getRandomPin(),
          imgSrc: event.target.result,
          caption: ''
        });
        saveCurrentBoardData();
      };
      reader.readAsDataURL(file);
    }

    document.querySelectorAll('.sticky-btn').forEach(btn => {
      bindInstantAction(btn, () => {
        playPinSound();
        const rect = surface.getBoundingClientRect();
        const note = createNoteElement({
          noteColor: btn.dataset.color,
          left: rect.width / 2 - 60 + (Math.random() * 24 - 12),
          top: rect.height / 2 - 55 + (Math.random() * 24 - 12),
          width: 120,
          height: 110,
          rotation: getRandomRotation(),
          pinClass: getRandomPin(),
          text: ''
        });
        saveCurrentBoardData();
        const textarea = note.querySelector('.sticky-textarea');
        setTimeout(() => textarea.focus(), 50);
      });
    });

    // --- カードインタラクション（回転・リサイズ正常復旧） ---
    function setupCardInteraction(el) {
      let isTouching = false;
      let isRealDragging = false;
      let isRotating = false;
      let isResizing = false;
      let startX = 0, startY = 0;
      let initLeft = 0, initTop = 0;
      let initWidth = 0, initHeight = 0;
      let initRot = 0, centerX = 0, centerY = 0, startAngle = 0;

      bindInstantAction(el.querySelector('.ctrl-delete'), (e) => {
        e.stopPropagation();
        playPinSound();
        el.classList.add('removing');
        setTimeout(() => {
          el.remove();
          saveCurrentBoardData();
        }, 220);
      });

      el.querySelectorAll('textarea').forEach(input => {
        input.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
        input.addEventListener('mousedown', (e) => e.stopPropagation());
        input.addEventListener('input', () => saveCurrentBoardData());
      });

      const onStart = (e) => {
        const target = e.target;

        // テキスト入力および削除/コピーボタンのみドラッグ・変形を遮断
        if (target.tagName.toLowerCase() === 'textarea') return;
        if (target.classList.contains('ctrl-delete') || target.classList.contains('ctrl-copy')) return;

        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        const pageY = e.touches ? e.touches[0].pageY : e.pageY;
        startX = pageX;
        startY = pageY;

        if (target.classList.contains('ctrl-rotate')) {
          isRotating = true;
          e.stopPropagation();
          el.style.zIndex = ++highestZIndex;
          const rect = el.getBoundingClientRect();
          centerX = rect.left + rect.width / 2;
          centerY = rect.top + rect.height / 2;
          startAngle = Math.atan2(pageY - centerY, pageX - centerX);
          initRot = parseFloat(el.dataset.rotation);
        } else if (target.classList.contains('ctrl-resize')) {
          isResizing = true;
          e.stopPropagation();
          el.style.zIndex = ++highestZIndex;
          initWidth = el.offsetWidth;
          initHeight = el.offsetHeight;
        } else {
          isTouching = true;
          isRealDragging = false;
          initLeft = el.offsetLeft;
          initTop = el.offsetTop;
        }
      };

      const onMove = (e) => {
        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        const pageY = e.touches ? e.touches[0].pageY : e.pageY;
        const diffX = pageX - startX;
        const diffY = pageY - startY;

        if (isRotating) {
          e.preventDefault();
          const currentAngle = Math.atan2(pageY - centerY, pageX - centerX);
          const angleDiff = currentAngle - startAngle;
          const newRot = initRot + (angleDiff * (180 / Math.PI));
          el.dataset.rotation = newRot.toFixed(1);
          updateTransform(el);
        } else if (isResizing) {
          e.preventDefault();
          const deltaX = startX - pageX;
          const newWidth = Math.min(320, Math.max(90, initWidth + deltaX));
          el.style.width = `${newWidth}px`;

          if (el.classList.contains('sticky-note')) {
            const deltaY = pageY - startY;
            const newHeight = Math.min(320, Math.max(80, initHeight + deltaY));
            el.style.height = `${newHeight}px`;
          }
        } else if (isTouching) {
          if (!isRealDragging && (Math.abs(diffX) > 15 || Math.abs(diffY) > 15)) {
            isRealDragging = true;
            el.style.zIndex = ++highestZIndex;
            el.classList.add('dragging');
            updateTransform(el, 1.04);
          }

          if (isRealDragging) {
            el.style.left = `${initLeft + diffX}px`;
            el.style.top = `${initTop + diffY}px`;
          }
        }
      };

      const onEnd = () => {
        if (isTouching) {
          if (isRealDragging) {
            playPinSound();
            el.classList.remove('dragging');
            updateTransform(el, 1);
            saveCurrentBoardData();
          } else {
            if (el.classList.contains('photo-card')) {
              const img = el.querySelector('img');
              if (img) openViewer(img.src);
            }
          }
        }
        if (isRotating || isResizing) saveCurrentBoardData();
        isTouching = false;
        isRealDragging = false;
        isRotating = false;
        isResizing = false;
      };

      el.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      el.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    initDB().then(() => {
      renderTabs();
      setupSwipeNavigation();
      switchBoard(currentBoardId);
    });
  </script>
</body>
</html>
